services:
  aliyun-supabase-mcp:
    build: .
    image: aliyun-supabase-mcp:latest
    stdin_open: true
    tty: true
    environment:
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_ACCESS_TOKEN: ${ALIYUN_ACCESS_TOKEN:-}
      ALIYUN_REGION_ID: ${ALIYUN_REGION_ID:-cn-hangzhou}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      SUPABASE_CLI_TIMEOUT: ${SUPABASE_CLI_TIMEOUT:-120}
      SUPABASE_CLI_MAX_TIMEOUT: ${SUPABASE_CLI_MAX_TIMEOUT:-600}
      SUPABASE_WORKDIR: /workspace
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8000}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-sse}
    ports:
      - "${MCP_PORT:-8000}:8000"
    volumes:
      - ./workspace:/workspace
